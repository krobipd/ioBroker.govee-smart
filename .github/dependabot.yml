# Dependabot configuration
# Cooldown delays version updates by 7 days (npm AND github-actions — GitHub supports `default-days` for Actions,
# dependabot-options-reference 2026-08); security updates are processed immediately.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # src-admin (Module-Federation admin component): its own package.json (repochecker W8905). Its dependencies move like
  # the root's — the release run lifts every one of them, proven by the component's build, type check and suite; only
  # the same compatibility holds as the root stay (krobi 2026-09-05 and 2026-10-22: every dependency moves).
  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@iobroker/gui-components'
      - dependency-name: '@iobroker/json-config'
      - dependency-name: '@mui/icons-material'
      - dependency-name: '@mui/material'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
