name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-**
    # A documentation-only push starts no run: no test can fail on a line of
    # prose. Per GitHub's docs "Path filters are not evaluated for pushes of
    # tags", so the release run on the tag is untouched. Deliberately only
    # under `push`, never under `pull_request`: there the run delivers the
    # required check of the branch protection (Dependabot merges).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE"
      # No job reads the Dependabot configuration; the pre-push guard rightly refuses a
      # skip-CI marker for it, so the filter is the only thing that keeps a config
      # change from running the full matrix (seven such runs on 2026-09-15).
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "24.x"
          type-checking: true
          lint: true

  repochecker-version-gate:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify io-package.json against ioBroker stable repository
        run: |
          set -euo pipefail
          # Source: sources-dist-stable.json — the official stable channel from
          # ioBroker.repositories. Default installations (`activeRepo: stable`)
          # pull every ioBroker adapter from there. Every adapter requirement
          # declared in io-package.json (common.dependencies +
          # common.globalDependencies) must be AT LEAST latest-stable.
          # Behind = drift (block). Ahead = allowed: the dependency check at
          # install time blocks the update on systems that do not meet the
          # requirement, and stable users only ever get the adapter version
          # pinned in sources-dist-stable.json anyway (tt-tom17 pattern:
          # ioBroker.public-transport 1.x on npm-latest with globalDependencies
          # admin >=8.0.1 before Admin 8 reached stable).
          URL="https://raw.githubusercontent.com/ioBroker/ioBroker.repositories/master/sources-dist-stable.json"
          HTTP_STATUS=$(curl -sLo /tmp/stable.json -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "::error ::sources-dist-stable.json returned 404 — file moved/renamed. Update workflow URL."
            exit 1
          fi
          if [ "$HTTP_STATUS" = "000" ] || [ "$HTTP_STATUS" -ge 500 ] 2>/dev/null; then
            echo "::warning ::sources-dist-stable.json not reachable (HTTP $HTTP_STATUS) — skipping live check"
            exit 0
          fi
          if [ "$HTTP_STATUS" -ne 200 ] 2>/dev/null; then
            echo "::warning ::sources-dist-stable.json returned HTTP $HTTP_STATUS — skipping live check"
            exit 0
          fi
          # Schema sanity: without js-controller + admin the file is broken
          JS_STABLE=$(jq -r '."js-controller".version // ""' /tmp/stable.json)
          ADMIN_STABLE=$(jq -r '.admin.version // ""' /tmp/stable.json)
          if [ -z "${JS_STABLE}" ] || [ -z "${ADMIN_STABLE}" ]; then
            echo "::error ::sources-dist-stable.json schema changed — could not parse js-controller/admin versions."
            exit 1
          fi
          # Iterate over every adapter dependency in io-package.json (dependencies + globalDependencies)
          # and compare each one against its stable value. Format: "<kind>\t<name>\t<value>"
          DEPS=$(jq -r '
            [
              (.common.dependencies // [] | map(to_entries[] | "dependencies\t\(.key)\t\(.value)")),
              (.common.globalDependencies // [] | map(to_entries[] | "globalDependencies\t\(.key)\t\(.value)"))
            ] | flatten | .[]
          ' io-package.json)
          FAIL=0
          while IFS=$'\t' read -r KIND NAME VALUE; do
            [ -z "${NAME}" ] && continue
            STABLE=$(jq -r --arg n "${NAME}" '.[$n].version // ""' /tmp/stable.json)
            if [ -z "${STABLE}" ]; then
              echo "::warning ::${NAME} not in sources-dist-stable.json — skipping (no autosync target)"
              continue
            fi
            case "${VALUE}" in
              ">="*) MIN="${VALUE#>=}" ;;
              *)
                echo "::error ::Unexpected format: io-package.json ${KIND}.${NAME}=${VALUE} — fleet standard is \">=<version>\""
                FAIL=1
                continue ;;
            esac
            if [ "${MIN}" = "${STABLE}" ]; then
              echo "✓ ${KIND}.${NAME} = ${VALUE}"
            elif [ "$(printf '%s\n%s\n' "${MIN}" "${STABLE}" | sort -V | head -n1)" = "${STABLE}" ]; then
              echo "✓ ${KIND}.${NAME} = ${VALUE} (ahead of stable ${STABLE} — install-side dependency check protects older systems)"
            else
              echo "::error ::Drift: io-package.json ${KIND}.${NAME}=${VALUE} is behind stable, expected at least >=${STABLE}"
              FAIL=1
            fi
          done <<< "${DEPS}"
          if [ "${FAIL}" -eq 1 ]; then
            echo ""
            echo "Source: https://github.com/ioBroker/ioBroker.repositories/blob/master/sources-dist-stable.json"
            echo "Fix: bump io-package.json common.dependencies / globalDependencies to at least the stable versions above."
            exit 1
          fi
          echo "✓ all ioBroker-deps at or ahead of stable repository"

  validate-devices:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run validate-devices

  workflow-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow YAML files (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  admin-component:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: Build admin custom component (Vite / Module Federation)
        run: npm run build:admin
      # Needs src-admin/node_modules from the build step; the root test matrix never has
      # them. `buildReact` calls vite directly, so without this step the component is
      # never type-checked anywhere.
      - name: Type-check the component with its own TypeScript
        run: npm run check:admin
      - name: Build the adapter
        run: npm run build
      # No drift check here any more: `build/` left version control with the
      # nogit rule, so `git diff -- build` can never report anything and the
      # step it used to guard with was silently doing nothing. What still
      # matters is that both builds RUN — the Module-Federation bundle and the
      # adapter — because the CI is now the only place either is produced.

  adapter-tests:
    # The tag push starts a COMPLETE second run: the matrix runs again there, and `deploy`
    # depends on the tests of its own run. That is the property the repochecker verifies —
    # never make this job or its step conditional on the ref.
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint, validate-devices]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Run tests
        uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          build: true

  adapter-inventory:
    # The adapter's own start proof, on every push: it runs against its fixture server
    # (test/inventory.js) and, with a previous release tag, proves that an update reaches
    # every existing object (upgrade suite). Locally the same run is release gate D06.
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags: the upgrade suite seeds the previous release's inventory
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Export the previous release's inventory for the upgrade suite
        run: |
          set -euo pipefail
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -n "$tag" ] && git show "$tag:test/objects.inventory.json" > /tmp/inventory-previous.json 2>/dev/null; then
            echo "INVENTORY_PREVIOUS=/tmp/inventory-previous.json" >> "$GITHUB_ENV"
            echo "previous inventory: $tag"
          else
            echo "no previous release — upgrade suite not applicable"
          fi
      - name: Start the adapter against its fixture server
        run: |
          set -euo pipefail
          npm run test:inventory 2>&1 | tee /tmp/inventory.log
          if [ -n "${INVENTORY_PREVIOUS:-}" ] && ! grep -q "upgrade from the previous release" /tmp/inventory.log; then
            echo "::error ::the upgrade suite did not run although a previous inventory exists"
            exit 1
          fi
      - name: Report when the committed inventory lags behind the code
        run: |
          if ! git diff --quiet -- test/objects.inventory.json; then
            echo "::warning ::test/objects.inventory.json differs from what the adapter produces — the release run regenerates it"
            git diff --stat -- test/objects.inventory.json
          fi

  # deploy.needs as a block list: the fleet checks read that form, and prettier leaves it
  # alone (a one-line list this long would be wrapped into a form the checks cannot read).
  deploy:
    needs:
      - check-and-lint
      - validate-devices
      - adapter-tests
      - repochecker-version-gate
      - workflow-lint
      - admin-component
      - adapter-inventory
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          # Always the highest EVEN major of the test matrix, floored at
          # max(minimumNodeVersionDeploy, engines.node) — the consistency audit aligns
          # this line in release mode; never edit it by hand. Odd majors never become
          # LTS (nodejs/Release/schedule.json), and the publish step is exactly where two
          # npm regressions hit (promise-retry on 22, sigstore on 24) with no gate to
          # catch them: the repochecker reports nothing above its deploy floor.
          node-version: "26.x"
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sentry: true
          sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-url: https://de.sentry.io
          sentry-org: power-dreams
          sentry-project: iobroker
          sentry-version-prefix: iobroker.govee-smart
          sentry-sourcemap-paths: build/
